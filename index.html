<style>
/* ===== Tokens ===== */
:root{
  --paper:#f3f2f2; --wash:#e6e4e3; --ink:#201e1d; --on-ink:#f3f2f2;
  --mute:#605d5d; --dim:#7d7979; --faint:#bab6b6; --rail:#d7d3d3;
  --line:rgba(32,30,29,.4); --hair:rgba(32,30,29,.18); --press:rgba(32,30,29,.07);
  --red:#ec3013; --red-hover:#dd2b0f; --red-ink:#ae1800; --tint:#ffe0d9; --alert:#fff2ef;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#181716; --wash:#111010; --ink:#f0eeed; --on-ink:#181716;
    --mute:#b4afae; --dim:#8a8584; --faint:#54504f; --rail:#36322f;
    --line:rgba(240,238,237,.38); --hair:rgba(240,238,237,.16); --press:rgba(240,238,237,.08);
    --red:#f0421f; --red-hover:#ff5634; --red-ink:#ff7a5c; --tint:#3d1a11; --alert:#2b1410;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#181716; --wash:#111010; --ink:#f0eeed; --on-ink:#181716;
  --mute:#b4afae; --dim:#8a8584; --faint:#54504f; --rail:#36322f;
  --line:rgba(240,238,237,.38); --hair:rgba(240,238,237,.16); --press:rgba(240,238,237,.08);
  --red:#f0421f; --red-hover:#ff5634; --red-ink:#ff7a5c; --tint:#3d1a11; --alert:#2b1410;
  color-scheme:dark;
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--paper);
  font-family:Archivo,"Helvetica Neue",system-ui,-apple-system,sans-serif;color:var(--ink);
  -webkit-font-smoothing:antialiased;overscroll-behavior:none}
button{font:inherit;color:inherit;background:none;border:0;margin:0;padding:0;text-align:left;cursor:pointer}
button:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--red);outline-offset:-3px}
input{font:inherit;color:inherit;background:transparent;border:0;width:100%}
input:focus{outline:none}
::-webkit-scrollbar{width:0;height:0}

/* ===== Chasis ===== */
#app{position:fixed;inset:0;display:flex;flex-direction:column;background:var(--paper)}
#screen{flex:1;min-height:0;display:flex;flex-direction:column;position:relative}
.head{flex:none;padding:calc(max(env(safe-area-inset-top),14px) + 10px) 20px 12px;
  border-bottom:2px solid var(--line);display:flex;align-items:flex-end;justify-content:space-between;gap:12px;background:var(--paper)}
.head-col{display:flex;flex-direction:column;gap:2px;min-width:0}
.eyebrow{font:600 10.5px/1 Archivo,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
.h1{font:800 21px/1.1 Archivo,sans-serif;letter-spacing:-.02em}
.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:28px}

/* ===== Piezas ===== */
.box{padding:20px;border-bottom:2px solid var(--line);display:flex;flex-direction:column;gap:14px}
.row{padding:13px 20px;border-top:1px solid var(--hair);display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%}
.row:active{background:var(--press)}
.stack{display:flex;flex-direction:column;gap:3px;min-width:0}
.name{font:600 13.5px/1.2 Archivo,sans-serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.note{font:400 11px/1.35 Archivo,sans-serif;color:var(--dim)}
.val{font:700 14px/1 Archivo,sans-serif;flex:none}
.sect{padding:22px 20px 6px;font:800 14px/1 Archivo,sans-serif;letter-spacing:-.01em;
  display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.sect .note{font-weight:500}
.prose{font:400 12.5px/1.5 Archivo,sans-serif;color:var(--mute);text-wrap:pretty}
.chip{flex:none;padding:7px 11px;border:2px solid var(--line);font:700 10.5px/1 Archivo,sans-serif;
  letter-spacing:.04em;text-transform:uppercase}
.chip:active{background:var(--press)}
.money{display:flex;align-items:baseline;gap:5px}
.money .sym{font:500 24px/1 Archivo,sans-serif;color:var(--dim)}
.money .big{font:800 50px/.88 Archivo,sans-serif;letter-spacing:-.04em}
.bar{display:flex;height:14px;border:2px solid var(--ink)}
.bar .fill{background:var(--ink)}
.bar .rest{flex:1;background:repeating-linear-gradient(135deg,var(--rail) 0 3px,var(--paper) 3px 6px)}
.legend{display:flex;justify-content:space-between;font:500 11.5px/1 Archivo,sans-serif;color:var(--mute)}
.duo{display:grid;grid-template-columns:1fr 1fr;border-bottom:2px solid var(--line)}
.duo>div{padding:14px 20px;display:flex;flex-direction:column;gap:4px}
.duo>div:first-child{border-right:2px solid var(--line)}
.kpi{font:800 20px/1 Archivo,sans-serif;letter-spacing:-.02em}
.track{height:6px;background:var(--rail);display:flex}
.track>i{display:block}
.swatch{width:9px;height:9px;flex:none}
.empty{padding:34px 20px;display:flex;flex-direction:column;gap:8px;border-bottom:2px solid var(--line)}
.empty b{font:800 15px/1.2 Archivo,sans-serif}
.cta{margin:18px 20px;padding:16px;background:var(--red);color:#f3f2f2;font:800 14px/1 Archivo,sans-serif;
  display:flex;align-items:center;justify-content:space-between;width:calc(100% - 40px)}
.cta:active{background:var(--red-hover)}
.cta[disabled]{background:var(--rail);color:var(--dim)}
.link{font:700 12.5px/1 Archivo,sans-serif;color:var(--red)}

/* ===== Barra de pestañas ===== */
#tabs{flex:none;display:flex;align-items:stretch;background:var(--paper);border-top:2px solid var(--ink);
  padding-bottom:max(env(safe-area-inset-bottom),10px)}
#tabs button{flex:1;padding:12px 0 12px 12px;display:flex;flex-direction:column;gap:6px;min-height:60px;
  border-right:1px solid var(--hair)}
#tabs button:last-child{border-right:0}
#tabs button:active{background:var(--press)}
#tabs .mark{width:12px;height:12px;background:var(--rail)}
#tabs .lab{font:700 10.5px/1 Archivo,sans-serif;letter-spacing:.02em;color:var(--dim)}
#tabs .on .mark{background:var(--red)}
#tabs .on .lab{color:var(--ink)}
#tabs .add{flex:0 0 78px;background:var(--red);color:#f3f2f2;justify-content:center;gap:4px;border:0}
#tabs .add:active{background:var(--red-hover)}
#tabs .add .plus{font:400 20px/1 Archivo,sans-serif}
#tabs .add .lab{font:700 10.5px/1 Archivo,sans-serif;color:#f3f2f2}

/* ===== Hojas (overlays) ===== */
#sheet:empty{display:none}
#sheet{position:fixed;inset:0;z-index:40;background:var(--paper);display:flex;flex-direction:column;
  animation:up .22s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{transform:translateY(100%)}to{transform:translateY(0)}}
@media (prefers-reduced-motion:reduce){#sheet{animation:none}}
.sheet-head{flex:none;padding:calc(max(env(safe-area-inset-top),14px) + 10px) 20px 12px;
  border-bottom:2px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px}
.sheet-title{font:800 17px/1 Archivo,sans-serif;letter-spacing:-.01em}
.x{width:32px;height:32px;flex:none;border:2px solid var(--line);display:flex;align-items:center;
  justify-content:center;font:700 15px/1 Archivo,sans-serif}
.x:active{background:var(--press)}
.back{padding:8px 14px 8px 0;font:700 13px/1 Archivo,sans-serif}
.sheet-foot{flex:none;padding-bottom:max(env(safe-area-inset-bottom),12px)}

/* ===== Teclado ===== */
.amount{padding:24px 20px 18px;border-bottom:2px solid var(--line);display:flex;flex-direction:column;gap:12px}
.amount .big{font:800 52px/.9 Archivo,sans-serif;letter-spacing:-.045em}
.keys{display:grid;grid-template-columns:repeat(3,1fr);border-top:2px solid var(--line)}
.keys button{height:58px;border-right:1px solid var(--hair);border-bottom:1px solid var(--hair);
  display:flex;align-items:center;padding-left:24px;font:700 22px/1 Archivo,sans-serif;user-select:none}
.keys button:active{background:var(--rail)}
.grid3{padding:10px 20px 14px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.pick{padding:11px 0 11px 10px;border:2px solid var(--ink);font:700 12px/1 Archivo,sans-serif;
  white-space:nowrap;overflow:hidden}
.pick.on{background:var(--ink);color:var(--on-ink)}
.field{padding:14px 20px;border-top:1px solid var(--hair);display:flex;flex-direction:column;gap:6px}
.field label{font:600 10.5px/1 Archivo,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
.field input{font:600 15px/1.2 Archivo,sans-serif;padding:2px 0}
.field input::placeholder{color:var(--faint)}

/* ===== Calendario ===== */
.dow{display:grid;grid-template-columns:repeat(7,1fr);border-bottom:1px solid var(--hair)}
.dow span{padding:8px 6px;font:600 9.5px/1 Archivo,sans-serif;letter-spacing:.06em;text-transform:uppercase;color:var(--dim)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);border-bottom:2px solid var(--line)}
.cal>*{aspect-ratio:1;border-right:1px solid var(--hair);border-bottom:1px solid var(--hair);
  padding:5px 6px;display:flex;flex-direction:column;justify-content:space-between}
.cal .n{font:600 11px/1 Archivo,sans-serif}
.cal .dot{height:5px}
.cal .today{background:var(--ink)}
.cal .today .n{color:var(--on-ink)}
.cal .sel{background:var(--tint)}
.cal .past .n{color:var(--faint)}

/* ===== Varios ===== */
.alerta{padding:16px 20px;border-bottom:2px solid var(--line);background:var(--alert);display:flex;flex-direction:column;gap:7px}
.alerta b{font:700 13px/1.3 Archivo,sans-serif;color:var(--red-ink)}
.check{width:22px;height:22px;flex:none;border:2px solid var(--ink);display:flex;align-items:center;
  justify-content:center;font:800 12px/1 Archivo,sans-serif;color:var(--on-ink)}
.check.on{background:var(--ink)}
.seg{padding:0 20px;display:flex}
.seg button{flex:1;padding:13px 0 13px 10px;border:2px solid var(--ink);border-right-width:0;
  font:700 12.5px/1 Archivo,sans-serif}
.seg button.on{background:var(--ink);color:var(--on-ink)}
.seg .cap{width:2px;background:var(--ink)}
.spark{display:flex;align-items:flex-end;gap:3px;height:80px;margin-top:4px}
.spark i{flex:1;background:var(--ink);display:block}
.danger{color:var(--red)}
.aviso{padding:16px 20px;border-bottom:2px solid var(--red);background:var(--alert);
  display:flex;flex-direction:column;gap:7px}
.aviso b{font:700 13px/1.3 Archivo,sans-serif;color:var(--red-ink)}
.toast{position:fixed;left:20px;right:20px;bottom:calc(max(env(safe-area-inset-bottom),10px) + 76px);
  z-index:60;background:var(--ink);color:var(--on-ink);padding:13px 16px;
  font:600 12.5px/1.35 Archivo,sans-serif;animation:up .18s ease}
</style>
</head>
<body>
<div id="app">
  <main id="screen"></main>
  <nav id="tabs"></nav>
</div>
<div id="sheet"></div>

<script>
"use strict";
/* =========================================================================
   Planificador — app local. Todo vive en el teléfono (localStorage).
   Estructura: datos -> cálculos -> vistas (strings de HTML) -> acciones.
   ========================================================================= */

/* ---------- 1. Utilidades ---------- */
const $ = id => document.getElementById(id);
const money = n => "₡" + Math.round(n || 0).toLocaleString("de-DE");
const num = n => Math.round(n || 0).toLocaleString("de-DE");
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const ym = d => d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0");
const daysIn = key => { const [y, m] = key.split("-").map(Number); return new Date(y, m, 0).getDate(); };
const MESES = ["enero","febrero","marzo","abril","mayo","junio","julio","agosto","setiembre","octubre","noviembre","diciembre"];
const mesLargo = key => { const [y, m] = key.split("-").map(Number); return MESES[m - 1] + " " + y; };
const hoy = () => new Date();
const hoyKey = () => ym(hoy());

/* ---------- 2. Datos ---------- */
const STORE = "planificador.v2";

const PALETA = ["#201e1d", "#605d5d", "#9b9797", "#ec3013", "#bab6b6", "#444141", "#7d7979"];
const SUGERIDAS = ["Casa", "Comida", "Transporte", "Ocio", "Salud", "Ahorro", "Deudas", "Educación"];

/* Arranca en blanco a propósito: los números solo sirven si son tuyos. */
function semilla() {
  return { v: 1, setup: false, ingreso: 0, cats: [], movs: [], metas: [], pagos: [], reglas: {}, tasa: 8 };
}

/* ¿Este entorno permite guardar? No alcanza con que exista localStorage:
   en vistas previas, ventanas privadas o webviews puede existir y fallar al escribir. */
function probarAlmacenamiento() {
  try {
    const t = "__prueba__";
    localStorage.setItem(t, "1");
    const ok = localStorage.getItem(t) === "1";
    localStorage.removeItem(t);
    return ok;
  } catch (e) { return false; }
}
let puedeGuardar = probarAlmacenamiento();

function cargar() {
  try {
    const raw = localStorage.getItem(STORE);
    if (!raw) return semilla();
    const d = JSON.parse(raw);
    if (!d || !d.cats) return semilla();
    if (d.setup === undefined) d.setup = d.cats.length > 0;
    return d;
  } catch (e) { return semilla(); }
}
function guardar() {
  try { localStorage.setItem(STORE, JSON.stringify(D)); puedeGuardar = true; }
  catch (e) { puedeGuardar = false; }
}

let D = cargar();

/* Estado de pantalla: no se guarda, se reconstruye en cada apertura. */
let U = { tab: "resumen", mes: hoyKey(), sheet: null, arg: null,
          draft: "", draftCat: null, draftTexto: "", diaSel: null, scroll: {}, paso: 1, catsSel: [] };

/* ---------- 3. Cálculos ---------- */
const catPorId = id => D.cats.find(c => c.id === id);
const movsDelMes = k => D.movs.filter(m => m.fecha.slice(0, 7) === k);
const gastadoCat = (id, k) => movsDelMes(k).filter(m => m.cat === id && m.monto < 0)
  .reduce((a, m) => a - m.monto, 0);
const gastadoTotal = k => movsDelMes(k).filter(m => m.monto < 0).reduce((a, m) => a - m.monto, 0);
const planeado = () => D.cats.reduce((a, c) => a + c.plan, 0);

function diasRestantes(k) {
  const t = daysIn(k);
  if (k > hoyKey()) return t;
  if (k < hoyKey()) return 0;
  return Math.max(1, t - hoy().getDate() + 1);
}

/* La alerta se calcula de verdad: categoría sobregirada + de dónde sale el dinero. */
function alerta(k) {
  const con = D.cats.filter(c => c.plan > 0).map(c => ({ c, dif: gastadoCat(c.id, k) - c.plan }));
  const sobre = con.filter(x => x.dif > 0).sort((a, b) => b.dif - a.dif)[0];
  if (!sobre) return null;
  const holgada = con.filter(x => x.dif < 0 && x.c.id !== sobre.c.id)
    .sort((a, b) => a.dif - b.dif)[0];
  return {
    titulo: sobre.c.nombre + " está " + money(sobre.dif) + " por encima del plan",
    texto: holgada
      ? "Podés mover " + money(Math.min(sobre.dif, -holgada.dif)) + " desde " + holgada.c.nombre +
        ", que va con holgura, o cerrar el mes " + money(sobre.dif) + " abajo."
      : "Ninguna otra categoría tiene holgura este mes. Subí el plan o recortá el gasto."
  };
}

/* ---------- 4. Vistas ---------- */
function vistaResumen() {
  const k = U.mes, ing = D.ingreso, gast = gastadoTotal(k), plan = planeado();
  const disp = ing - gast, dias = diasRestantes(k);
  const a = alerta(k);
  const ahorroPct = ing > 0 ? Math.round((disp / ing) * 100) : 0;
  return `
  <div class="head">
    <div class="head-col">
      <div style="display:flex;align-items:center;gap:10px">
        <button class="eyebrow" data-act="mes" data-arg="-1" aria-label="Mes anterior">←</button>
        <span class="eyebrow">${esc(mesLargo(k))}</span>
        <button class="eyebrow" data-act="mes" data-arg="1" aria-label="Mes siguiente">→</button>
      </div>
      <div class="h1">Resumen</div>
    </div>
    <button class="chip" data-act="sheet" data-arg="ajustes">Ajustes</button>
  </div>
  <div class="scroll" id="sc">
    <div class="box">
      <div class="legend">
        <span class="eyebrow">Disponible este mes</span>
        <button class="chip" data-act="sheet" data-arg="ingreso">Editar</button>
      </div>
      <div class="money"><span class="sym">₡</span><span class="big">${num(disp)}</span></div>
      <div class="bar">
        <div class="fill" style="width:${plan ? Math.min(100, (gast / plan) * 100) : 0}%"></div>
        <div class="rest"></div>
      </div>
      <div class="legend"><span>${money(gast)} gastados</span><span>${money(plan)} planeados</span></div>
    </div>
    <div class="duo">
      <div>
        <span class="eyebrow">Por día</span>
        <span class="kpi">${dias ? money(Math.max(0, disp / dias)) : "—"}</span>
        <span class="note">${dias ? "quedan " + dias + " días" : "mes cerrado"}</span>
      </div>
      <div>
        <span class="eyebrow">Tasa de ahorro</span>
        <span class="kpi">${ahorroPct}%</span>
        <span class="note">del ingreso</span>
      </div>
    </div>
    ${a ? `<div class="alerta">
      <b>${esc(a.titulo)}</b>
      <div class="prose">${esc(a.texto)}</div>
      <button class="link" data-act="tab" data-arg="pagos" style="align-self:flex-start;padding-top:3px">Ver el presupuesto →</button>
    </div>` : ""}
    <div class="sect">Últimos movimientos<span class="note">${movsDelMes(k).length} este mes</span></div>
    ${movsDelMes(k).slice().sort((x, y) => y.fecha.localeCompare(x.fecha)).slice(0, 4).map(filaMov).join("")
      || `<div class="empty"><b>${D.cats.length ? "Sin movimientos todavía" : "Empezá por tus categorías"}</b>
        <div class="prose">${D.cats.length
          ? "Tocá <b>+ Gasto</b> abajo para registrar el primero. Cada gasto que anotás hace que los números de arriba sirvan para decidir."
          : "Sin categorías no hay presupuesto. Creá las tuyas desde la pestaña Pagos."}</div></div>`}
  </div>`;
}

function filaMov(m) {
  const c = m.cat ? catPorId(m.cat) : null;
  const dia = Number(m.fecha.slice(8));
  return `<button class="row" data-act="sheet" data-arg="mov:${m.id}">
    <div class="stack">
      <div class="name">${esc(m.comercio)}</div>
      <div class="note">${dia} ${MESES[Number(m.fecha.slice(5, 7)) - 1].slice(0, 3)} · ${c ? esc(c.nombre) : "Sin categoría"}</div>
    </div>
    <div class="val" style="color:${m.monto > 0 ? "var(--red-ink)" : "var(--ink)"}">${m.monto > 0 ? "+" : "−"}${money(Math.abs(m.monto))}</div>
  </button>`;
}

function vistaPagos() {
  const k = U.mes, total = daysIn(k), [yy, mm] = k.split("-").map(Number);
  const primero = (new Date(yy, mm - 1, 1).getDay() + 6) % 7; // lunes = 0
  const hoyDia = k === hoyKey() ? hoy().getDate() : -1;
  const conPago = new Set(D.pagos.map(p => Math.min(p.dia, total)));

  let celdas = "";
  for (let i = 0; i < primero; i++) celdas += `<div></div>`;
  for (let n = 1; n <= total; n++) {
    const cls = [n === hoyDia ? "today" : "", U.diaSel === n ? "sel" : "", n < hoyDia ? "past" : ""].join(" ");
    celdas += `<button class="${cls}" data-act="dia" data-arg="${n}">
      <span class="n">${n}</span>
      <span class="dot" style="background:${conPago.has(n) ? "var(--red)" : "transparent"}"></span>
    </button>`;
  }

  const pagos = D.pagos.slice().sort((a, b) => a.dia - b.dia)
    .filter(p => U.diaSel ? Math.min(p.dia, total) === U.diaSel : true);
  const pendiente = D.pagos.filter(p => !p.pagado.includes(k)).reduce((a, p) => a + p.monto, 0);

  return `
  <div class="head">
    <div class="head-col">
      <div class="eyebrow">${money(pendiente)} sin pagar en ${esc(mesLargo(k))}</div>
      <div class="h1">Pagos</div>
    </div>
    <button class="chip" data-act="sheet" data-arg="nuevoPago">+ Pago</button>
  </div>
  <div class="scroll" id="sc">
    <div class="dow"><span>Lun</span><span>Mar</span><span>Mié</span><span>Jue</span><span>Vie</span><span>Sáb</span><span>Dom</span></div>
    <div class="cal">${celdas}</div>
    <div class="sect">${U.diaSel ? "Día " + U.diaSel : "Todos los cobros"}
      ${U.diaSel ? `<button class="link" data-act="dia" data-arg="0">Ver todos</button>` : ""}</div>
    ${pagos.map(p => {
      const ok = p.pagado.includes(k);
      return `<button class="row" data-act="pagar" data-arg="${p.id}">
        <div style="display:flex;align-items:center;gap:11px;min-width:0">
          <div class="check ${ok ? "on" : ""}" style="width:34px;height:34px;border-color:var(--line)">${ok ? "✓" : Math.min(p.dia, total)}</div>
          <div class="stack">
            <div class="name" style="${ok ? "text-decoration:line-through;color:var(--dim)" : ""}">${esc(p.nombre)}</div>
            <div class="note">${ok ? "Pagado · registrado como gasto" : esc(p.nota || "Tocá para marcar pagado")}</div>
          </div>
        </div>
        <div class="val">${money(p.monto)}</div>
      </button>`;
    }).join("") || `<div class="empty"><b>${U.diaSel ? "Sin cobros el día " + U.diaSel : "Sin cobros fijos"}</b>
      <div class="prose">${U.diaSel
        ? "Ningún cobro cae en esta fecha."
        : "Renta, luz, internet, tarjetas: lo que se cobra solo todos los meses. Agregalos una vez y el calendario te avisa antes de que el mes te sorprenda."}</div>
      ${U.diaSel ? "" : `<button class="link" data-act="sheet" data-arg="nuevoPago" style="align-self:flex-start;padding-top:4px">Agregar el primero →</button>`}</div>`}
    <div class="sect" style="border-top:2px solid var(--line);margin-top:14px;padding-top:20px">
      Presupuesto por categoría<span class="note">${D.cats.length} categorías</span></div>
    ${D.cats.length === 0 ? `<div class="empty"><b>Sin categorías</b>
      <div class="prose">Son los cajones donde cae cada gasto. Casa, Comida, Transporte: las que uses de verdad.</div></div>` : ""}
    ${D.cats.map(c => {
      const g = gastadoCat(c.id, k), over = g > c.plan;
      return `<button class="row" data-act="sheet" data-arg="plan:${c.id}" style="flex-direction:column;align-items:stretch;gap:9px">
        <div style="display:flex;align-items:center;justify-content:space-between;gap:10px">
          <div style="display:flex;align-items:center;gap:9px;min-width:0">
            <span class="swatch" style="background:${c.color}"></span>
            <span class="name">${esc(c.nombre)}</span>
          </div>
          <span class="val" style="color:${c.plan && over ? "var(--red)" : "var(--ink)"}">${!c.plan ? "Sin plan" : over ? money(g - c.plan) + " sobre" : money(c.plan - g) + " libre"}</span>
        </div>
        <div class="track"><i style="width:${c.plan ? Math.min(100, (g / c.plan) * 100) : 0}%;background:${c.color}"></i></div>
        <div class="note">${c.plan ? money(g) + " de " + money(c.plan) + (over ? " · sobregirado" : g === c.plan ? " · completo" : " · al día") : money(g) + " gastados · tocá para definir el plan"}</div>
      </button>`;
    }).join("")}
    <button class="row" data-act="sheet" data-arg="nuevaCat"><span class="link">+ Nueva categoría</span></button>
  </div>`;
}

function vistaMetas() {
  const ahorrado = D.metas.reduce((a, g) => a + g.actual, 0);
  const objetivo = D.metas.reduce((a, g) => a + g.total, 0);
  const aporteTotal = D.metas.reduce((a, g) => a + g.aporte, 0);
  const r = D.tasa / 100 / 12;
  const proy = Array.from({ length: 11 }, (_, i) => {
    let b = 0; for (let m = 0; m < i * 12; m++) b = b * (1 + r) + aporteTotal; return b;
  });
  const fin = proy[10], puesto = aporteTotal * 120, interes = fin - puesto;

  return `
  <div class="head">
    <div class="head-col">
      <div class="eyebrow">${money(ahorrado)} de ${money(objetivo)}</div>
      <div class="h1">Metas</div>
    </div>
    <button class="chip" data-act="sheet" data-arg="nuevaMeta">+ Meta</button>
  </div>
  <div class="scroll" id="sc">
    ${D.metas.map(g => {
      const pct = g.total ? Math.round((g.actual / g.total) * 100) : 0;
      const faltan = g.aporte > 0 ? Math.ceil(Math.max(0, g.total - g.actual) / g.aporte) : null;
      return `<button class="row" data-act="sheet" data-arg="meta:${g.id}" style="flex-direction:column;align-items:stretch;gap:12px;padding:18px 20px">
        <div style="display:flex;align-items:baseline;justify-content:space-between;gap:10px">
          <span style="font:700 15px/1.15 Archivo,sans-serif">${esc(g.nombre)}</span>
          <span class="note" style="flex:none">${pct}% completo</span>
        </div>
        <div style="display:flex;align-items:baseline;gap:6px">
          <span style="font:800 26px/1 Archivo,sans-serif;letter-spacing:-.03em">${money(g.actual)}</span>
          <span class="note">de ${money(g.total)}</span>
        </div>
        <div class="track" style="height:10px"><i style="width:${Math.min(100, pct)}%;background:${g.color}"></i></div>
        <div class="note" style="color:var(--mute)">${faltan !== null ? "A " + money(g.aporte) + " por mes, la alcanzás en " + faltan + " meses" : "Sin aporte mensual definido"}</div>
      </button>`;
    }).join("") || `<div class="empty"><b>Todavía no hay metas</b><div class="prose">Una meta es un número con fecha. Sin eso, el ahorro es solo lo que sobra.</div></div>`}
    ${aporteTotal > 0 ? `
    <div style="padding:20px;border-top:2px solid var(--line);display:flex;flex-direction:column;gap:8px">
      <div class="eyebrow">Proyección · 10 años al ${D.tasa}%</div>
      <div class="prose">Aportando ${money(aporteTotal)} al mes llegás a ${money(fin)}, de los cuales ${money(interes)} los pone el interés compuesto.</div>
      <div class="spark">${proy.map(b => `<i style="height:${Math.max(3, (b / fin) * 100)}%"></i>`).join("")}</div>
      <div class="legend" style="font-size:10px"><span>hoy</span><span>año 10</span></div>
    </div>` : ""}
  </div>`;
}

function vistaMovs() {
  const k = U.mes, ms = movsDelMes(k).slice().sort((a, b) => b.fecha.localeCompare(a.fecha));
  const gastos = ms.filter(m => m.monto < 0).reduce((a, m) => a - m.monto, 0);
  const sinCat = ms.filter(m => !m.cat).length;
  return `
  <div class="head">
    <div class="head-col">
      <div class="eyebrow">${ms.length} este mes · ${money(gastos)} en gastos</div>
      <div class="h1">Movimientos</div>
    </div>
    ${sinCat ? `<div class="note" style="padding-bottom:3px">${sinCat} sin clasificar</div>` : ""}
  </div>
  <div class="scroll" id="sc">
    ${ms.map(filaMov).join("") || `<div class="empty"><b>Mes en blanco</b><div class="prose">Cada gasto que registrás hace que los números de Resumen sirvan para decidir.</div></div>`}
  </div>`;
}

/* ---------- 5. Hojas ---------- */
function teclado(act) {
  return `<div class="keys">${["1","2","3","4","5","6","7","8","9","000","0","←"]
    .map(t => `<button data-act="${act}" data-arg="${t}">${t}</button>`).join("")}</div>`;
}

function hojaGasto() {
  const n = Number(U.draft || 0), listo = n > 0 && U.draftCat;
  return `
  <div class="sheet-head">
    <div class="sheet-title">Agregar gasto</div>
    <button class="x" data-act="cerrar" aria-label="Cerrar">×</button>
  </div>
  <div class="scroll">
    <div class="amount">
      <div class="money"><span class="sym">₡</span>
        <span class="big" style="color:${U.draft ? "var(--ink)" : "var(--faint)"}">${U.draft ? num(n) : "0"}</span></div>
    </div>
    <div class="field">
      <label for="com">Comercio</label>
      <input id="com" placeholder="Automercado, Uber, café…" value="${esc(U.draftTexto)}" data-bind="draftTexto" autocomplete="off">
    </div>
    <div style="padding:16px 20px 4px" class="eyebrow">Categoría</div>
    ${D.cats.length === 0 ? `<div class="empty" style="border-bottom:0">
      <b>Todavía no hay categorías</b>
      <div class="prose">Un gasto necesita un lugar donde caer. Creá la primera y volvé aquí.</div>
      <button class="link" data-act="sheet" data-arg="nuevaCat" style="align-self:flex-start;padding-top:4px">Crear categoría →</button>
    </div>` : ""}
    <div class="grid3">${D.cats.map(c =>
      `<button class="pick ${U.draftCat === c.id ? "on" : ""}" data-act="draftCat" data-arg="${c.id}">${esc(c.nombre)}</button>`).join("")}</div>
    ${teclado("tecla")}
    <button class="cta" data-act="registrar" ${listo ? "" : "disabled"}>
      <span>${listo ? "Registrar " + money(n) : U.draft ? "Elegí una categoría" : "Escribí un monto"}</span><span style="font-weight:400">→</span>
    </button>
  </div>
  <div class="sheet-foot"></div>`;
}

function hojaMonto(titulo, valorActual, efecto, act, fmt, extra) {
  fmt = fmt || money;
  const n = Number(U.draft || 0);
  return `
  <div class="sheet-head">
    <div class="sheet-title">${esc(titulo)}</div>
    <button class="x" data-act="cerrar" aria-label="Cerrar">×</button>
  </div>
  <div class="scroll">
    <div class="amount">
      <div class="money">${fmt === money ? '<span class="sym">₡</span>' : ""}
        <span class="big" style="color:${U.draft ? "var(--ink)" : "var(--faint)"}">${U.draft ? num(n) : num(valorActual)}${fmt === money ? "" : "%"}</span></div>
      <div class="prose">${esc(efecto(U.draft ? n : valorActual))}</div>
    </div>
    ${teclado("tecla")}
    <button class="cta" data-act="${act}" ${U.draft ? "" : "disabled"}>
      <span>${U.draft ? "Guardar " + fmt(n) : "Escribí el valor nuevo"}</span><span style="font-weight:400">→</span>
    </button>
    ${extra || ""}
  </div>
  <div class="sheet-foot"></div>`;
}

function hojaMov(id) {
  const m = D.movs.find(x => x.id === id);
  if (!m) return "";
  const dia = Number(m.fecha.slice(8)), mes = MESES[Number(m.fecha.slice(5, 7)) - 1];
  return `
  <div class="sheet-head">
    <button class="back" data-act="cerrar">← Volver</button>
    <button class="back danger" data-act="borrarMov" data-arg="${m.id}" style="padding-right:0">Eliminar</button>
  </div>
  <div class="scroll">
    <div class="box">
      <div class="eyebrow">${dia} de ${mes}</div>
      <div style="font:800 34px/1 Archivo,sans-serif;letter-spacing:-.035em">${m.monto > 0 ? "+" : "−"}${money(Math.abs(m.monto))}</div>
      <div style="font:600 15px/1.2 Archivo,sans-serif">${esc(m.comercio)}</div>
    </div>
    <div style="padding:16px 20px 4px" class="eyebrow">Categoría</div>
    ${D.cats.map(c => `<button class="row" data-act="catMov" data-arg="${m.id}:${c.id}"
        style="background:${m.cat === c.id ? "var(--tint)" : "transparent"}">

          <span class="swatch" style="width:10px;height:10px;background:${c.color}"></span>
          <span class="name" style="font-size:14px">${esc(c.nombre)}</span>
        </div>
        <span style="font:800 13px/1 Archivo,sans-serif;color:var(--red)">${m.cat === c.id ? "✓" : ""}</span>
      </button>`).join("")}
    <div style="padding:18px 20px" >
      <div class="eyebrow" style="margin-bottom:9px">Regla</div>
      <button data-act="regla" data-arg="${m.id}" style="display:flex;align-items:flex-start;gap:11px;width:100%">
        <span class="check ${D.reglas[m.comercio.toLowerCase()] ? "on" : ""}">${D.reglas[m.comercio.toLowerCase()] ? "✓" : ""}</span>
        <span class="prose">Clasificar siempre <b style="color:var(--ink)">${esc(m.comercio)}</b> en esta categoría</span>
      </button>
    </div>
    <div style="height:30px"></div>
  </div>
  <div class="sheet-foot"></div>`;
}

function hojaMeta(id) {
  const g = D.metas.find(x => x.id === id);
  if (!g) return "";
  const pct = g.total ? Math.round((g.actual / g.total) * 100) : 0;
  const falta = Math.max(0, g.total - g.actual);
  const meses = g.aporte > 0 ? Math.ceil(falta / g.aporte) : null;
  return `
  <div class="sheet-head">
    <button class="back" data-act="cerrar">← Metas</button>
    <button class="back danger" data-act="borrarMeta" data-arg="${g.id}" style="padding-right:0">Eliminar</button>
  </div>
  <div class="scroll">
    <div class="box">
      <div style="font:800 24px/1.1 Archivo,sans-serif;letter-spacing:-.02em">${esc(g.nombre)}</div>
      <div style="display:flex;align-items:baseline;gap:7px">
        <span style="font:800 40px/.95 Archivo,sans-serif;letter-spacing:-.04em">${money(g.actual)}</span>
        <span class="note">de ${money(g.total)}</span>
      </div>
      <div class="track" style="height:14px"><i style="width:${Math.min(100, pct)}%;background:${g.color}"></i></div>
      <div class="note" style="color:var(--mute)">${pct}% completo · faltan ${money(falta)}</div>
    </div>
    <div class="duo">
      <div><span class="eyebrow">Aporte mensual</span><span class="kpi">${money(g.aporte)}</span></div>
      <div><span class="eyebrow">Te falta</span><span class="kpi">${meses !== null ? meses + " meses" : "—"}</span></div>
    </div>
    <div style="padding:18px 20px 8px" class="eyebrow">Ajustar aporte</div>
    <div class="seg">
      ${[25000, 50000, 100000, 150000].map(v =>
        `<button class="${g.aporte === v ? "on" : ""}" data-act="aporte" data-arg="${g.id}:${v}">₡${v / 1000}k</button>`).join("")}
      <span class="cap"></span>
    </div>
    <div style="padding:14px 20px 0" class="prose">
      ${g.aporte > 0
        ? "Con " + money(g.aporte) + " al mes la meta se cumple en " + Math.ceil(falta / g.aporte) + " meses."
        : "Elegí un aporte para ver en cuánto tiempo la alcanzás."}
    </div>
    <button class="cta" data-act="aportar" data-arg="${g.id}">
      <span>Aportar ${money(g.aporte)} ahora</span><span style="font-weight:400">→</span>
    </button>
    <div style="padding:0 20px 30px" class="note">Suma el aporte a la meta y lo registra como gasto de Ahorro.</div>
  </div>
  <div class="sheet-foot"></div>`;
}

function hojaForm(titulo, campos, act, nota) {

function hojaSetup() {
  const paso = U.paso || 1;
  if (paso === 1) {
    const n = Number(U.draft || 0);
    return `
    <div class="sheet-head"><div class="sheet-title">Paso 1 de 2</div></div>
    <div class="scroll">
      ${puedeGuardar ? "" : BANNER}
      <div class="box">
        <div style="font:800 26px/1.1 Archivo,sans-serif;letter-spacing:-.02em">¿Cuánto entra al mes?</div>

      </div>
      <div class="amount">
        <div class="money"><span class="sym">₡</span>
          <span class="big" style="color:${U.draft ? "var(--ink)" : "var(--faint)"}">${U.draft ? num(n) : "0"}</span></div>
      </div>
      ${teclado("tecla")}
      <button class="cta" data-act="paso2" ${n > 0 ? "" : "disabled"}>
        <span>${n > 0 ? "Continuar" : "Escribí tu ingreso"}</span><span style="font-weight:400">→</span>
      </button>
      <button class="row" data-act="paso2" style="border-top:0;justify-content:center">
        <span class="note">Lo defino después</span>
      </button>
      <div style="height:20px"></div>
    </div>
    <div class="sheet-foot"></div>`;
  }
  const sel = U.catsSel || [];
  return `
  <div class="sheet-head">
    <div class="sheet-title">Paso 2 de 2</div>
    <button class="back" data-act="paso1" style="padding-right:0">← Ingreso</button>
  </div>
  <div class="scroll">
    <div class="box">
      <div style="font:800 26px/1.1 Archivo,sans-serif;letter-spacing:-.02em">¿En qué se va?</div>
      <div class="prose">Elegí las categorías que usás de verdad. Pocas y claras funcionan mejor que muchas: si dudás dónde va un gasto, sobran categorías. Podés agregar, renombrar y borrar después.</div>
    </div>
    <div class="grid3">${SUGERIDAS.map(nom =>
      `<button class="pick ${sel.includes(nom) ? "on" : ""}" data-act="toggleCat" data-arg="${esc(nom)}">${esc(nom)}</button>`).join("")}</div>
    <div class="field">
      <label for="otra">Otra categoría</label>
      <input id="otra" placeholder="Mascotas, Gimnasio…" data-bind="draftTexto" value="${esc(U.draftTexto)}" autocomplete="off">
    </div>
    <button class="row" data-act="agregarSugerida"><span class="link">+ Agregar a la lista</span></button>
    <button class="cta" data-act="terminarSetup" ${sel.length ? "" : "disabled"}>
      <span>${sel.length ? "Empezar con " + sel.length + " categorías" : "Elegí al menos una"}</span><span style="font-weight:400">→</span>
    </button>
    <div style="padding:0 20px 30px" class="note">Los montos de cada categoría los definís desde Pagos, cuando quieras.</div>
  </div>
  <div class="sheet-foot"></div>`;
}

/* ---------- 6. Render ---------- */
const BANNER = `<div class="aviso">
  <b>Esta ventana no guarda tus datos</b>
  <div class="prose">Todo lo que escribás desaparece al cerrarla. Pasa en vistas previas dentro de otra app, en ventanas privadas y cuando el navegador bloquea el almacenamiento.</div>
  <div class="prose"><b>Qué hacer:</b> abrí la app en Safari o Chrome desde su propio enlace, instalala en la pantalla de inicio, y recién ahí configurala.</div>
  <button class="link" data-act="copiarJSON" style="align-self:flex-start;padding-top:4px">Copiar lo que llevo ahora →</button>
</div>`;

function render() {
  if (!D.setup) { U.sheet = "setup"; U.tab = "resumen"; }
  const sc = document.querySelector("#sc");
  if (sc) U.scroll[U.tab] = sc.scrollTop;

  $("screen").innerHTML =
    U.tab === "resumen" ? vistaResumen() :
    U.tab === "pagos"   ? vistaPagos()   :
    U.tab === "metas"   ? vistaMetas()   : vistaMovs();

  const nuevo = document.querySelector("#sc");
  if (nuevo) {
    if (!puedeGuardar) nuevo.insertAdjacentHTML("afterbegin", BANNER);
    nuevo.scrollTop = U.scroll[U.tab] || 0;
  }

  const tabs = [["resumen", "Resumen"], ["pagos", "Pagos"], ["metas", "Metas"], ["movs", "Movimientos"]];
  $("tabs").innerHTML =
    tabs.slice(0, 2).map(t => botonTab(t)).join("") +
    `<button class="add" data-act="sheet" data-arg="gasto"><span class="plus">+</span><span class="lab">Gasto</span></button>` +
    tabs.slice(2).map(t => botonTab(t)).join("");

  renderSheet();
}
const botonTab = ([id, lab]) =>
  `<button class="${U.tab === id ? "on" : ""}" data-act="tab" data-arg="${id}">
     <span class="mark"></span><span class="lab">${lab}</span></button>`;

function renderSheet() {
  const s = U.sheet, el = $("sheet");
  if (!s) { el.innerHTML = ""; return; }
  const k = U.mes;
  el.innerHTML =
    s === "setup"      ? hojaSetup() :
    s === "gasto"      ? hojaGasto() :
    s === "ajustes"    ? hojaAjustes() :
    s === "ingreso"    ? hojaMonto("Ingreso del mes", D.ingreso,
        v => "Con " + money(v) + " de ingreso quedan " + money(v - gastadoTotal(k)) + " disponibles y " +
             money(Math.max(0, (v - gastadoTotal(k)) / Math.max(1, diasRestantes(k)))) + " por día.", "guardarIngreso") :
    s === "tasa"       ? hojaMonto("Rendimiento anual (%)", D.tasa,
        v => "Se usa para proyectar tus metas a 10 años. 8% es el promedio histórico de un índice amplio; un ahorro bancario en Costa Rica anda más cerca de 4%.", "guardarTasa", v => v + "%") :
    s === "plan"       ? hojaMonto("Plan de " + (catPorId(U.arg) || {}).nombre, (catPorId(U.arg) || {}).plan,
        v => v > 0 ? "Llevás " + money(gastadoCat(U.arg, k)) + " gastados aquí este mes."
                   : "Sin plan definido. Escribí cuánto querés gastar como máximo en esta categoría cada mes.",
        "guardarPlan", money, `
        <div class="field">
          <label for="ren">Renombrar</label>
          <input id="ren" value="${esc((catPorId(U.arg) || {}).nombre)}" autocomplete="off">
        </div>
        <button class="row" data-act="renombrarCat" data-arg="${U.arg}"><span class="link">Guardar nombre</span></button>
        <button class="row" data-act="borrarCat" data-arg="${U.arg}">
          <div class="stack"><div class="name danger">Eliminar categoría</div>
          <div class="note">Sus movimientos quedan sin clasificar</div></div>
        </button>
        <div style="height:30px"></div>`) :
    s === "mov"        ? hojaMov(U.arg) :
    s === "meta"       ? hojaMeta(U.arg) :
    s === "nuevaMeta"  ? hojaForm("Nueva meta", [
        { k: "nombre", label: "Nombre", ph: "Fondo de emergencia" },
        { k: "total", label: "Monto objetivo", ph: "3000000", tipo: "num" },
        { k: "actual", label: "Ya tenés (opcional)", ph: "0", tipo: "num" },
        { k: "aporte", label: "Aporte mensual", ph: "100000", tipo: "num" }], "crearMeta") :
    s === "nuevoPago"  ? hojaForm("Nuevo cobro fijo", [
        { k: "nombre", label: "Nombre", ph: "Internet" },
        { k: "monto", label: "Monto", ph: "27900", tipo: "num" },
        { k: "dia", label: "Día del mes", ph: "30", tipo: "num" },
        { k: "nota", label: "Nota (opcional)", ph: "Débito automático" }], "crearPago") :
    s === "nuevaCat"   ? hojaForm("Nueva categoría", [
        { k: "nombre", label: "Nombre", ph: "Mascotas" },
        { k: "plan", label: "Plan mensual", ph: "25000", tipo: "num" }], "crearCat") :
    s === "restaurar"  ? hojaForm("Restaurar respaldo", [{ k: "json", label: "Pegá el respaldo aquí", ph: "{…}" }],
        "restaurar", "Esto reemplaza todos los datos actuales.") : "";
}

/* ---------- 7. Acciones ---------- */
function avisar(texto) {
  const t = document.createElement("div");
  t.className = "toast"; t.textContent = texto; t.setAttribute("role", "status");
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 2600);
}
const campo = k => (document.getElementById("f_" + k) || {}).value || "";
const limpiarNum = s => Number(String(s).replace(/[^\d]/g, "")) || 0;

const ACCIONES = {
  tab(v) { U.tab = v; U.diaSel = null; },
  mes(dir) {
    const [y, m] = U.mes.split("-").map(Number);
    const d = new Date(y, m - 1, 1);
    d.setMonth(d.getMonth() + Number(dir));
    U.mes = ym(d);
    U.diaSel = null;
  },
  sheet(v) {
    const [s, a] = v.split(":");
    U.sheet = s; U.arg = a || null; U.draft = ""; U.draftCat = null; U.draftTexto = "";
  },
  cerrar() { U.sheet = null; U.arg = null; U.draft = ""; U.draftCat = null; U.draftTexto = ""; },
  tecla(t) {
    U.draft = t === "←" ? U.draft.slice(0, -1) : (U.draft + t).slice(0, 10);
  },
  draftCat(v) { U.draftCat = v; },
  dia(v) { U.diaSel = Number(v) === Number(U.diaSel) || Number(v) === 0 ? null : Number(v); },

  paso2() { if (U.draft) D.ingreso = Number(U.draft); U.paso = 2; U.draft = ""; guardar(); },
  paso1() { U.paso = 1; U.draft = ""; },
  toggleCat(nom) {
    U.catsSel = U.catsSel || [];
    const i = U.catsSel.indexOf(nom);
    if (i >= 0) U.catsSel.splice(i, 1); else U.catsSel.push(nom);
  },
  agregarSugerida() {
    const nom = (U.draftTexto || "").trim();
    if (!nom) { avisar("Escribí el nombre primero"); return; }
    if (!SUGERIDAS.includes(nom)) SUGERIDAS.push(nom);
    U.catsSel = U.catsSel || [];
    if (!U.catsSel.includes(nom)) U.catsSel.push(nom);
    U.draftTexto = "";
  },
  terminarSetup() {
    const sel = U.catsSel || [];
    if (!sel.length) return;
    D.cats = sel.map((nombre, i) => ({ id: uid(), nombre, plan: 0, color: PALETA[i % PALETA.length] }));
    D.setup = true; guardar();
    U.sheet = null; U.paso = 1; U.draft = ""; U.catsSel = []; U.draftTexto = "";
    avisar("Listo. Definí el plan de cada categoría desde Pagos.");
  },

  registrar() {
    const n = Number(U.draft || 0);
    if (!n || !U.draftCat) return;
    const nombre = (U.draftTexto || catPorId(U.draftCat).nombre).trim();
    const d = hoy(), dia = U.mes === hoyKey() ? d.getDate() : 1;
    D.movs.push({ id: uid(), comercio: nombre, monto: -n, cat: U.draftCat,
                  fecha: U.mes + "-" + String(dia).padStart(2, "0") });
    guardar(); ACCIONES.cerrar(); U.tab = "resumen";
    avisar("Registrado " + money(n) + " en " + catPorId(D.movs[D.movs.length - 1].cat).nombre);
  },
  guardarIngreso() { D.ingreso = Number(U.draft || D.ingreso); guardar(); ACCIONES.cerrar(); },
  guardarTasa() { D.tasa = Math.min(30, Number(U.draft || D.tasa)); guardar(); ACCIONES.cerrar(); },
  guardarPlan() { const c = catPorId(U.arg); if (c) c.plan = Number(U.draft || c.plan); guardar(); ACCIONES.cerrar(); },

  catMov(v) {
    const [id, cat] = v.split(":");
    const m = D.movs.find(x => x.id === id); if (!m) return;
    m.cat = cat;
    if (D.reglas[m.comercio.toLowerCase()]) D.reglas[m.comercio.toLowerCase()] = cat;
    guardar();
  },
  regla(id) {
    const m = D.movs.find(x => x.id === id); if (!m || !m.cat) { avisar("Elegí primero una categoría"); return; }
    const key = m.comercio.toLowerCase();
    if (D.reglas[key]) delete D.reglas[key]; else D.reglas[key] = m.cat;
    guardar();
  },
  borrarMov(id) { D.movs = D.movs.filter(m => m.id !== id); guardar(); ACCIONES.cerrar(); avisar("Movimiento eliminado"); },

  pagar(id) {
    const p = D.pagos.find(x => x.id === id); if (!p) return;
    const k = U.mes, i = p.pagado.indexOf(k);
    if (i >= 0) {
      p.pagado.splice(i, 1);
      D.movs = D.movs.filter(m => m.pagoId !== p.id || m.fecha.slice(0, 7) !== k);
    } else {
      p.pagado.push(k);
      const cat = D.reglas[p.nombre.toLowerCase()] || (D.cats[0] || {}).id || null;
      D.movs.push({ id: uid(), pagoId: p.id, comercio: p.nombre, monto: -p.monto, cat,
                    fecha: k + "-" + String(Math.min(p.dia, daysIn(k))).padStart(2, "0") });
      avisar(p.nombre + " marcado como pagado");
    }
    guardar();
  },

  aporte(v) { const [id, n] = v.split(":"); const g = D.metas.find(x => x.id === id); if (g) g.aporte = Number(n); guardar(); },
  aportar(id) {
    const g = D.metas.find(x => x.id === id); if (!g || !g.aporte) return;
    g.actual += g.aporte;
    const ah = D.cats.find(c => /ahorro/i.test(c.nombre)) || D.cats[D.cats.length - 1];
    D.movs.push({ id: uid(), comercio: g.nombre, monto: -g.aporte, cat: ah ? ah.id : null,
                  fecha: U.mes + "-" + String(Math.min(hoy().getDate(), daysIn(U.mes))).padStart(2, "0") });
    guardar(); avisar("Aportaste " + money(g.aporte) + " a " + g.nombre);
  },
  borrarMeta(id) { D.metas = D.metas.filter(g => g.id !== id); guardar(); ACCIONES.cerrar(); },

  crearMeta() {
    const nombre = campo("nombre").trim(), total = limpiarNum(campo("total"));
    if (!nombre || !total) { avisar("Falta el nombre o el monto objetivo"); return; }
    D.metas.push({ id: uid(), nombre, total, actual: limpiarNum(campo("actual")),
                   aporte: limpiarNum(campo("aporte")), color: D.metas.length % 2 ? "#ec3013" : "#201e1d" });
    guardar(); ACCIONES.cerrar(); U.tab = "metas";
  },
  crearPago() {
    const nombre = campo("nombre").trim(), monto = limpiarNum(campo("monto"));
    const dia = Math.min(31, Math.max(1, limpiarNum(campo("dia")) || 1));
    if (!nombre || !monto) { avisar("Falta el nombre o el monto"); return; }
    D.pagos.push({ id: uid(), nombre, monto, dia, nota: campo("nota").trim(), pagado: [] });
    guardar(); ACCIONES.cerrar();
  },
  crearCat() {
    const nombre = campo("nombre").trim(); if (!nombre) { avisar("Falta el nombre"); return; }
    D.cats.push({ id: uid(), nombre, plan: limpiarNum(campo("plan")), color: "#9b9797" });
    guardar(); ACCIONES.cerrar();
  },

  renombrarCat(id) {
    const c = catPorId(id), el = document.getElementById("ren");
    const nom = el && el.value ? el.value.trim() : "";
    if (!c || !nom) { avisar("Escribí un nombre"); return; }
    c.nombre = nom; guardar(); ACCIONES.cerrar(); avisar("Categoría renombrada");
  },
  borrarCat(id) {
    if (U.confirmar !== id) { U.confirmar = id; avisar("Tocá otra vez para eliminar la categoría");
      setTimeout(() => { U.confirmar = null; }, 4000); return; }
    U.confirmar = null;
    D.cats = D.cats.filter(c => c.id !== id);
    D.movs.forEach(m => { if (m.cat === id) m.cat = null; });
    Object.keys(D.reglas).forEach(k => { if (D.reglas[k] === id) delete D.reglas[k]; });
    guardar(); ACCIONES.cerrar(); avisar("Categoría eliminada");
  },

  copiarCSV() {
    const filas = [["fecha", "comercio", "categoria", "monto"]].concat(
      D.movs.slice().sort((a, b) => a.fecha.localeCompare(b.fecha)).map(m =>
        [m.fecha, m.comercio, m.cat ? (catPorId(m.cat) || {}).nombre || "" : "", m.monto]));
    copiar(filas.map(f => f.map(x => `"${String(x).replace(/"/g, '""')}"`).join(",")).join("\n"), "CSV copiado");
  },
  copiarJSON() { copiar(JSON.stringify(D), "Respaldo copiado"); },
  restaurar() {
    try {
      const d = JSON.parse(campo("json"));
      if (!d || !d.cats) throw 0;
      D = d; guardar(); ACCIONES.cerrar(); avisar("Respaldo restaurado");
    } catch (e) { avisar("Ese texto no es un respaldo válido"); }
  },
  borrarTodo() {
    if (!U.confirmar) { U.confirmar = true; avisar("Tocá otra vez para borrar todo. Es definitivo."); 
      setTimeout(() => { U.confirmar = false; }, 4000); return; }
    U.confirmar = false;
    D = semilla(); guardar();
    U = { tab: "resumen", mes: hoyKey(), sheet: null, arg: null, draft: "", draftCat: null,
          draftTexto: "", diaSel: null, scroll: {}, paso: 1, catsSel: [] };
    avisar("Listo, empezamos de cero");
  }
};

async function copiar(texto, ok) {
  try { await navigator.clipboard.writeText(texto); avisar(ok); }
  catch (e) {
    const ta = document.createElement("textarea");
    ta.value = texto; ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select();
    try { document.execCommand("copy"); avisar(ok); } catch (e2) { avisar("No se pudo copiar"); }
    ta.remove();
  }
}

/* ---------- 8. Eventos ---------- */
document.addEventListener("click", e => {
  const b = e.target.closest("[data-act]");
  if (!b) return;
  const fn = ACCIONES[b.dataset.act];
  if (!fn) return;
  fn(b.dataset.arg);
  render();
});
document.addEventListener("input", e => {
  const el = e.target;
  if (el.dataset && el.dataset.bind) U[el.dataset.bind] = el.value;  // sin re-render: no perder el foco
});

/* Aplicar reglas guardadas al escribir el comercio en "Agregar gasto". */
document.addEventListener("blur", e => {
  if (e.target.id === "com" && !U.draftCat) {
    const r = D.reglas[(e.target.value || "").toLowerCase()];
    if (r) { U.draftCat = r; renderSheet(); }
  }
}, true);

/* ---------- 9. Arranque ---------- */
render();

/* Service worker: solo funciona si el archivo sw.js existe junto al index.
   En un hosting propio da soporte sin conexión; si no está, falla en silencio. */
if ("serviceWorker" in navigator && location.protocol === "https:") {
  navigator.serviceWorker.register("./sw.js").catch(() => {});
}
</script>
